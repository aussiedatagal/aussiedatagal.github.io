      <h1>aussiedatagal</h1>
      <p class="intro">A collection of projects I've worked on in my spare time. Mostly things I found interesting or wanted to explore. Some might be useful, others are just for fun.</p>
      <main>
        <article>
          <h2><a href="https://aussiedatagal.github.io/return-to-work-cost/">Return to Work Cost (A Childcare Subsidy Calculator)</a></h2>
          <p>Sydney parents earn less money working full time than part time when you account for childcare costs</p>
          <a href="https://github.com/aussiedatagal/return-to-work-cost">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/nsw-food-penalty-map/">NSW Food Penalty Notices</a></h2>
          <p>Interactive map showing food businesses issued penalty notices for violating food safety standards. The NSW Food Authority publishes lists of businesses that have breached food safety laws to help consumers make informed decisions.</p>
          <a href="https://github.com/aussiedatagal/nsw-food-penalty-map">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/childcare-quality-ratings/">Childcare Quality Ratings</a></h2>
          <p>Explore quality standards ratings for childcare services across Australia using data from ACECQA.</p>
          <a href="https://github.com/aussiedatagal/childcare-quality-ratings">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/nsw-rent-vs-mortgage/">NSW Rent vs Mortgage</a></h2>
          <p>Comparison of rental costs versus mortgage payments across NSW postcodes.</p>
          <a href="https://github.com/aussiedatagal/nsw-rent-vs-mortgage">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/child-growth-calculator/">Child Growth Calculator</a></h2>
          <p>Calculate and track child growth percentiles based on WHO growth standards.</p>
          <a href="https://github.com/aussiedatagal/child-growth-calculator">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/nsw-housing-affordability/">NSW Housing Affordability</a></h2>
          <p>Analysis of housing affordability trends and patterns across NSW.</p>
          <a href="https://github.com/aussiedatagal/nsw-housing-affordability">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/nsw-rent-bond-refunds/">NSW Rental Bond Outcomes</a></h2>
          <p>Interactive map showing postcode-level rental bond refund outcomes for 2024. Explore where tenants are more or less likely to have bond withheld.</p>
          <a href="https://github.com/aussiedatagal/nsw-rent-bond-refunds">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/tourle/">Tourle</a></h2>
          <p>A daily traveling salesman puzzle game.</p>
          <a href="https://github.com/aussiedatagal/tourle">Source code</a>
        </article>
        <article>
          <h2><a href="https://aussiedatagal.github.io/brick/">Brick</a></h2>
          <p>A daily LEGO set puzzle game where players guess the LEGO set based on a series of images.</p>
          <a href="https://github.com/aussiedatagal/brick">Source code</a>
        </article>

    <script>
      // Single Page Apps for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
